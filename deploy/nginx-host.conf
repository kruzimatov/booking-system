# Host nginx site for the server (for example /etc/nginx/sites-available/booking).
# Terminates HTTPS and forwards to the web container on 127.0.0.1:8081.
# After enabling: sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d booking.example.com

server {
    listen 80;
    server_name booking.example.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
