# Serves the built SPA and proxies /api to the backend: one origin, so the auth cookie
# works without CORS. This file is included inside nginx's http block.

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;
server_tokens off;

# The SPA gets a strict CSP; /api (including Swagger UI, which loads from a CDN) does not.
map $uri $content_security_policy {
    ~^/api/  "";
    default  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 64k;

    # Behind the host's TLS proxy: rate limit the real visitor, not the proxy's address.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    add_header Content-Security-Policy $content_security_policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # $http_host keeps the port, so the API's Origin check sees the host the browser used.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # Only login and registration get the strict limit (password guessing, mass sign-ups).
    # /auth/me runs on every page load and stays under the normal API limit, so users
    # sharing one public IP (mobile carrier NAT) are not logged out by each other.
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api:8000;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api:8000;
    }

    # Hashed file names never change, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please wait a moment.","details":{}}}';
    }
}
